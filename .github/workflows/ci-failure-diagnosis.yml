name: CI Failure Diagnosis
run-name: CI Failure Diagnosis source-run=${{ github.event.workflow_run.id }} source-attempt=${{ github.event.workflow_run.run_attempt }}

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: ci-failure-diagnosis-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  diagnose:
    name: Diagnose CI failure (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted default-branch diagnostic code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Validate event decision and hostile-log handling
        run: python3 .github/scripts/ci_failure_diagnosis.py --self-test

      - name: Produce structured diagnosis report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/ci_failure_diagnosis.py